<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <meta name="theme-color" id="theme-color-meta" content="#1a1535"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Pill Reminder"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <title>Pill Reminder</title>

  <!-- Inline manifest via JS blob -->
  <script>
    const manifestData = {
      name: "Pill Reminder",
      short_name: "Pills",
      description: "Daily medicine tracker with history",
      start_url: "./",
      display: "standalone",
      background_color: "#1a1535",
      theme_color: "#1a1535",
      orientation: "portrait",
      icons: [
        { src: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='100' fill='%231a1535'/%3E%3Crect x='80' y='196' width='352' height='120' rx='60' fill='%23a78bfa' opacity='.3'/%3E%3Crect x='80' y='196' width='176' height='120' rx='60' fill='%23a78bfa'/%3E%3C/svg%3E", sizes: "any", type: "image/svg+xml", purpose: "any maskable" }
      ]
    };
    const blob = new Blob([JSON.stringify(manifestData)], {type:"application/manifest+json"});
    const manifestURL = URL.createObjectURL(blob);
    const link = document.createElement("link");
    link.rel = "manifest"; link.href = manifestURL;
    document.head.appendChild(link);

    // Apple touch icon
    const iconSvg = `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='100' fill='%231a1535'/><rect x='80' y='196' width='352' height='120' rx='60' fill='%23a78bfa' opacity='.3'/><rect x='80' y='196' width='176' height='120' rx='60' fill='%23a78bfa'/></svg>`;
    const iconBlob = new Blob([iconSvg.replace(/%23/g,'#')], {type:"image/svg+xml"});
    const iconURL = URL.createObjectURL(iconBlob);
    const iconLink = document.createElement("link");
    iconLink.rel = "apple-touch-icon"; iconLink.href = iconURL;
    document.head.appendChild(iconLink);
  </script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overscroll-behavior: none; }
    body {
      font-family: Georgia, 'Times New Roman', serif;
      -webkit-tap-highlight-color: transparent;
      -webkit-font-smoothing: antialiased;
    }
    #root { min-height: 100%; }
    input, button { font-family: inherit; }
    button { -webkit-tap-highlight-color: transparent; }
    /* safe area for notched phones */
    .safe-bottom { padding-bottom: env(safe-area-inset-bottom, 16px); }
    .safe-top    { padding-top:    env(safe-area-inset-top, 0px); }
  </style>
</head>
<body>
<div id="root"></div>

<!-- React + Babel -->
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>

<script type="text/babel">
const { useState, useEffect, useCallback, useRef } = React;

// ─── Storage (localStorage) ────────────────────────────────────────
const PILL_LIST_KEY = "pillreminder:pilllist";
const dayKey = d => `pillreminder:day:${d}`;

function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function formatDateLabel(str) {
  const [y,m,d] = str.split("-").map(Number);
  return new Date(y,m-1,d).toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"});
}
function getLast30Days() {
  return Array.from({length:30},(_,i)=>{
    const d=new Date(); d.setDate(d.getDate()-i);
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  });
}
function lsGet(k){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):null; }catch{return null;} }
function lsSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch{} }

const DEFAULT_PILLS = {
  morning:[{id:"m1",name:"Vitamin D",dose:"1 tablet"}],
  night:  [{id:"n1",name:"Melatonin",dose:"1 tablet"}],
};

// ─── SVG Icons ──────────────────────────────────────────────────────
const Sun=()=><svg width="22" height="22" viewBox="0 0 24 24" fill="none">
  <circle cx="12" cy="12" r="5" fill="currentColor"/>
  {[0,45,90,135,180,225,270,315].map((deg,i)=><line key={i} x1="12" y1="3" x2="12" y2="5.5" stroke="currentColor" strokeWidth="2" strokeLinecap="round" transform={`rotate(${deg} 12 12)`}/>)}
</svg>;
const Moon=()=><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79z" fill="currentColor"/></svg>;
const Check=()=><svg width="14" height="14" viewBox="0 0 24 24" fill="none"><polyline points="20 6 9 17 4 12" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"/></svg>;
const Plus=()=><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><line x1="12" y1="5" x2="12" y2="19" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/><line x1="5" y1="12" x2="19" y2="12" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/></svg>;
const Trash=()=><svg width="14" height="14" viewBox="0 0 24 24" fill="none"><polyline points="3 6 5 6 21 6" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/><path d="M19 6l-1 14H6L5 6" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/><path d="M10 11v6M14 11v6" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/><path d="M9 6V4h6v2" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/></svg>;
const CalIcon=()=><svg width="17" height="17" viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="18" height="18" rx="2" stroke="currentColor" strokeWidth="2"/><line x1="16" y1="2" x2="16" y2="6" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/><line x1="8" y1="2" x2="8" y2="6" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/><line x1="3" y1="10" x2="21" y2="10" stroke="currentColor" strokeWidth="2"/></svg>;
const BackIcon=()=><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><polyline points="15 18 9 12 15 6" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>;

// ─── Main App ───────────────────────────────────────────────────────
function App() {
  const [view, setView]         = useState("today");
  const [pillList, setPillList] = useState(null);
  const [todayLog, setTodayLog] = useState(null);
  const [history, setHistory]   = useState([]);
  const [adding, setAdding]     = useState(null);
  const [newName, setNewName]   = useState("");
  const [newDose, setNewDose]   = useState("");
  const [flash, setFlash]       = useState(null);
  const [loading, setLoading]   = useState(true);
  const [selectedDay, setSelectedDay] = useState(null);
  const [installPrompt, setInstallPrompt] = useState(null);
  const [installed, setInstalled] = useState(false);

  const hour = new Date().getHours();
  const isNight = hour >= 18 || hour < 6;

  // Theme colour synced to OS bar
  useEffect(() => {
    const meta = document.getElementById("theme-color-meta");
    if (meta) meta.content = isNight ? "#0d0b1e" : "#fff7ed";
    document.body.style.background = isNight
      ? "linear-gradient(150deg,#0d0b1e 0%,#1a1535 60%,#221d40 100%)"
      : "linear-gradient(150deg,#fff7ed 0%,#fde8d8 60%,#fce7f3 100%)";
  }, [isNight]);

  // PWA install prompt
  useEffect(() => {
    const handler = e => { e.preventDefault(); setInstallPrompt(e); };
    window.addEventListener("beforeinstallprompt", handler);
    window.addEventListener("appinstalled", () => { setInstalled(true); setInstallPrompt(null); });
    return () => window.removeEventListener("beforeinstallprompt", handler);
  }, []);

  // Bootstrap
  useEffect(() => {
    let list = lsGet(PILL_LIST_KEY) || DEFAULT_PILLS;
    lsSet(PILL_LIST_KEY, list);
    setPillList(list);
    const today = todayStr();
    let log = lsGet(dayKey(today));
    if (!log) { log = buildEmptyLog(list); lsSet(dayKey(today), log); }
    setTodayLog(log);
    setLoading(false);
  }, []);

  function buildEmptyLog(list) {
    const morning={}, night={};
    (list.morning||[]).forEach(p=>morning[p.id]=false);
    (list.night||[]).forEach(p=>night[p.id]=false);
    return {morning,night};
  }

  // History
  const loadHistory = useCallback(() => {
    const days = getLast30Days();
    const results = days.map(d => ({ date:d, log:lsGet(dayKey(d)) })).filter(r=>r.log!==null);
    setHistory(results);
  }, []);
  useEffect(() => { if (view==="history") loadHistory(); }, [view, loadHistory]);

  function toggleTaken(session, id) {
    const newLog = { ...todayLog, [session]:{ ...todayLog[session], [id]: !todayLog[session][id] } };
    setTodayLog(newLog); lsSet(dayKey(todayStr()), newLog);
    if (newLog[session][id]) { setFlash(id); setTimeout(()=>setFlash(null), 700); }
  }

  function addPill(session) {
    if (!newName.trim()) return;
    const id=`${session[0]}${Date.now()}`;
    const pill={id, name:newName.trim(), dose:newDose.trim()||"1 tablet"};
    const newList={...pillList,[session]:[...pillList[session],pill]};
    const newLog={...todayLog,[session]:{...todayLog[session],[id]:false}};
    setPillList(newList); setTodayLog(newLog);
    lsSet(PILL_LIST_KEY,newList); lsSet(dayKey(todayStr()),newLog);
    setAdding(null); setNewName(""); setNewDose("");
  }

  function deletePill(session, id) {
    const newList={...pillList,[session]:pillList[session].filter(p=>p.id!==id)};
    const newLog={...todayLog,[session]:{...todayLog[session]}};
    delete newLog[session][id];
    setPillList(newList); setTodayLog(newLog);
    lsSet(PILL_LIST_KEY,newList); lsSet(dayKey(todayStr()),newLog);
  }

  function doInstall() {
    if (!installPrompt) return;
    installPrompt.prompt();
    installPrompt.userChoice.then(()=>setInstallPrompt(null));
  }

  // Colours
  const bg        = isNight ? "linear-gradient(150deg,#0d0b1e 0%,#1a1535 60%,#221d40 100%)" : "linear-gradient(150deg,#fff7ed 0%,#fde8d8 60%,#fce7f3 100%)";
  const cardBg    = isNight ? "rgba(255,255,255,0.05)" : "rgba(255,255,255,0.65)";
  const cardBrd   = isNight ? "rgba(255,255,255,0.09)" : "rgba(255,255,255,0.85)";
  const textMain  = isNight ? "#f0e8ff" : "#3d1200";
  const textMuted = isNight ? "rgba(200,180,255,0.45)" : "rgba(80,30,0,0.4)";
  const sessions  = pillList ? [
    {key:"morning",label:"Morning",Icon:Sun,  accent:isNight?"#fbbf24":"#f97316"},
    {key:"night",  label:"Night",  Icon:Moon, accent:isNight?"#a78bfa":"#8b5cf6"},
  ] : [];

  function sessionProg(s) {
    if (!pillList||!todayLog) return {total:0,taken:0};
    const pills=pillList[s]||[], log=todayLog[s]||{};
    return {total:pills.length, taken:pills.filter(p=>log[p.id]).length};
  }
  const {total:mt,taken:mk}=sessionProg("morning");
  const {total:nt,taken:nk}=sessionProg("night");
  const total=mt+nt, taken=mk+nk;

  function dayScore(log,list) {
    if (!log||!list) return {pct:0,total:0,taken:0};
    const all=[...(list.morning||[]),...(list.night||[])];
    const t=all.length;
    const k=all.filter(p=>{
      const s=list.morning.find(x=>x.id===p.id)?"morning":"night";
      return log[s]?.[p.id];
    }).length;
    return {pct:t?Math.round(k/t*100):0,total:t,taken:k};
  }

  if (loading) return (
    <div style={{minHeight:"100vh",background:bg,display:"flex",alignItems:"center",justifyContent:"center"}}>
      <div style={{color:textMain,opacity:0.4,fontSize:14,letterSpacing:"0.1em",fontFamily:"'Courier New',monospace",textTransform:"uppercase"}}>Loading…</div>
    </div>
  );

  // ── HISTORY VIEW ──────────────────────────────────────────────────
  if (view==="history") return (
    <div style={{minHeight:"100vh",background:bg,paddingBottom:40}}>
      <div style={{maxWidth:440,margin:"0 auto",padding:"0 16px"}}>
        <div className="safe-top" style={{display:"flex",alignItems:"center",gap:12,paddingTop:36,paddingBottom:24}}>
          <button onClick={()=>{setView("today");setSelectedDay(null);}} style={{width:36,height:36,borderRadius:10,border:"none",background:isNight?"rgba(255,255,255,0.08)":"rgba(0,0,0,0.07)",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",color:textMain}}>
            <BackIcon/>
          </button>
          <div>
            <div style={{fontSize:10,letterSpacing:"0.18em",textTransform:"uppercase",color:textMuted,fontFamily:"'Courier New',monospace"}}>{selectedDay?formatDateLabel(selectedDay):"Last 30 days"}</div>
            <h2 style={{margin:0,fontSize:24,fontWeight:700,color:textMain,letterSpacing:"-0.02em"}}>{selectedDay?"Day Detail":"History"}</h2>
          </div>
        </div>

        {selectedDay ? (() => {
          const dayData=history.find(h=>h.date===selectedDay);
          const log=dayData?.log;
          return (
            <div style={{display:"flex",flexDirection:"column",gap:14}}>
              {sessions.map(({key,label,Icon,accent})=>{
                const pills=pillList[key]||[];
                return (
                  <div key={key} style={{background:cardBg,borderRadius:18,border:`1px solid ${cardBrd}`,overflow:"hidden",boxShadow:isNight?"0 6px 24px rgba(0,0,0,0.35)":"0 6px 24px rgba(200,80,30,0.1)"}}>
                    <div style={{display:"flex",alignItems:"center",gap:9,padding:"16px 18px 12px",borderBottom:`1px solid ${isNight?"rgba(255,255,255,0.07)":"rgba(0,0,0,0.05)"}`}}>
                      <div style={{color:accent,display:"flex"}}><Icon/></div>
                      <span style={{fontWeight:700,fontSize:16,color:textMain}}>{label}</span>
                    </div>
                    <div style={{padding:"8px 0"}}>
                      {pills.length===0
                        ? <div style={{textAlign:"center",padding:"18px",color:textMuted,fontSize:13,fontStyle:"italic"}}>No medicines</div>
                        : pills.map(pill=>{
                          const t=log?.[key]?.[pill.id]??false;
                          return (
                            <div key={pill.id} style={{display:"flex",alignItems:"center",gap:10,padding:"9px 18px",opacity:t?1:0.4}}>
                              <div style={{width:22,height:22,borderRadius:6,flexShrink:0,background:t?accent:"transparent",border:`2px solid ${t?accent:isNight?"rgba(200,180,255,0.25)":"rgba(0,0,0,0.12)"}`,display:"flex",alignItems:"center",justifyContent:"center",color:"#fff"}}>
                                {t&&<Check/>}
                              </div>
                              <div style={{flex:1}}>
                                <div style={{fontSize:14,fontWeight:600,color:textMain,textDecoration:t?"none":"line-through"}}>{pill.name}</div>
                                <div style={{fontSize:11,color:textMuted,fontFamily:"'Courier New',monospace"}}>{pill.dose}</div>
                              </div>
                              <div style={{fontSize:11,fontWeight:700,letterSpacing:"0.08em",fontFamily:"'Courier New',monospace",textTransform:"uppercase",color:t?accent:textMuted}}>{t?"Taken":"Missed"}</div>
                            </div>
                          );
                        })
                      }
                    </div>
                  </div>
                );
              })}
            </div>
          );
        })() : (
          <div style={{display:"flex",flexDirection:"column",gap:8}}>
            {history.length===0&&<div style={{textAlign:"center",padding:"40px",color:textMuted,fontStyle:"italic"}}>No history yet</div>}
            {history.map(({date,log})=>{
              const {pct,taken:tk,total:tt}=dayScore(log,pillList);
              const isToday=date===todayStr();
              const col=pct===100?"#22c55e":pct>=50?"#f97316":"#ef4444";
              const circ2=2*Math.PI*18;
              return (
                <button key={date} onClick={()=>setSelectedDay(date)} style={{display:"flex",alignItems:"center",gap:14,background:cardBg,borderRadius:14,border:`1px solid ${isToday?(isNight?"rgba(167,139,250,0.4)":"rgba(249,115,22,0.35)"):cardBrd}`,padding:"13px 16px",cursor:"pointer",textAlign:"left",boxShadow:isNight?"0 4px 16px rgba(0,0,0,0.25)":"0 4px 16px rgba(200,80,30,0.08)",width:"100%"}}>
                  <div style={{position:"relative",width:44,height:44,flexShrink:0}}>
                    <svg width="44" height="44" style={{transform:"rotate(-90deg)"}}>
                      <circle cx="22" cy="22" r="18" fill="none" stroke={isNight?"rgba(255,255,255,0.07)":"rgba(0,0,0,0.07)"} strokeWidth="4"/>
                      <circle cx="22" cy="22" r="18" fill="none" stroke={col} strokeWidth="4" strokeDasharray={circ2} strokeDashoffset={circ2*(1-pct/100)} strokeLinecap="round"/>
                    </svg>
                    <div style={{position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,fontWeight:700,color:col,fontFamily:"'Courier New',monospace"}}>{pct}%</div>
                  </div>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontSize:15,fontWeight:700,color:textMain}}>{isToday?"Today":formatDateLabel(date)}</div>
                    <div style={{fontSize:11,color:textMuted,fontFamily:"'Courier New',monospace"}}>{tk}/{tt} medicines taken</div>
                  </div>
                  <div style={{display:"flex",flexWrap:"wrap",gap:3,maxWidth:36,justifyContent:"flex-end"}}>
                    {[...(pillList.morning||[]),...(pillList.night||[])].map(p=>{
                      const s=pillList.morning.find(x=>x.id===p.id)?"morning":"night";
                      return <div key={p.id} style={{width:7,height:7,borderRadius:"50%",background:log?.[s]?.[p.id]?"#22c55e":"rgba(128,128,128,0.25)",flexShrink:0}}/>;
                    })}
                  </div>
                </button>
              );
            })}
          </div>
        )}
      </div>
    </div>
  );

  // ── TODAY VIEW ────────────────────────────────────────────────────
  const pct = total ? taken/total : 0;
  const r=28, circ=2*Math.PI*r;
  const ringColor = pct===1?"#22c55e":isNight?"#a78bfa":"#f97316";

  return (
    <div style={{minHeight:"100vh",background:bg,paddingBottom:40}}>
      {/* Header */}
      <div className="safe-top" style={{padding:"32px 20px 16px",textAlign:"center"}}>
        <div style={{fontSize:10,letterSpacing:"0.2em",textTransform:"uppercase",color:textMuted,marginBottom:6,fontFamily:"'Courier New',monospace"}}>
          {new Date().toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"})}
        </div>
        <h1 style={{margin:0,fontSize:32,fontWeight:700,color:textMain,letterSpacing:"-0.02em",lineHeight:1.1}}>Daily Medicines</h1>

        {/* Progress ring */}
        <div style={{display:"flex",flexDirection:"column",alignItems:"center",marginTop:18}}>
          <div style={{position:"relative",width:76,height:76}}>
            <svg width="76" height="76" style={{transform:"rotate(-90deg)"}}>
              <circle cx="38" cy="38" r={r} fill="none" stroke={isNight?"rgba(255,255,255,0.07)":"rgba(0,0,0,0.07)"} strokeWidth="5"/>
              <circle cx="38" cy="38" r={r} fill="none" stroke={ringColor} strokeWidth="5"
                strokeDasharray={circ} strokeDashoffset={circ*(1-pct)} strokeLinecap="round"
                style={{transition:"stroke-dashoffset 0.6s cubic-bezier(0.4,0,0.2,1)"}}/>
            </svg>
            <div style={{position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center",fontSize:15,fontWeight:700,color:ringColor,fontFamily:"'Courier New',monospace"}}>{taken}/{total}</div>
          </div>
          <div style={{fontSize:10,color:textMuted,fontFamily:"'Courier New',monospace",letterSpacing:"0.1em",textTransform:"uppercase",marginTop:6}}>
            {taken===total&&total>0?"All done! 🎉":"taken today"}
          </div>
        </div>

        {/* Install button (shown only when available & not yet installed) */}
        {installPrompt && !installed && (
          <button onClick={doInstall} style={{marginTop:14,display:"inline-flex",alignItems:"center",gap:6,padding:"8px 18px",borderRadius:20,border:"none",background:isNight?"rgba(167,139,250,0.2)":"rgba(249,115,22,0.15)",color:isNight?"#c4b5fd":"#c2410c",cursor:"pointer",fontSize:12,fontWeight:700,fontFamily:"'Courier New',monospace",letterSpacing:"0.08em",textTransform:"uppercase"}}>
            ⬇︎ Add to Home Screen
          </button>
        )}

        {/* History button */}
        <button onClick={()=>setView("history")} style={{marginTop:installPrompt?8:14,display:"inline-flex",alignItems:"center",gap:6,padding:"7px 16px",borderRadius:20,border:"none",background:isNight?"rgba(255,255,255,0.07)":"rgba(0,0,0,0.06)",color:textMuted,cursor:"pointer",fontSize:12,fontFamily:"'Courier New',monospace",letterSpacing:"0.1em",textTransform:"uppercase"}}>
          <CalIcon/> View History
        </button>
      </div>

      {/* Sessions */}
      <div style={{maxWidth:440,margin:"0 auto",padding:"0 16px",display:"flex",flexDirection:"column",gap:16}}>
        {sessions.map(({key,label,Icon,accent})=>{
          const pills=pillList[key]||[], log=todayLog[key]||{};
          const allDone=pills.length>0&&pills.every(p=>log[p.id]);
          return (
            <div key={key} style={{background:cardBg,backdropFilter:"blur(12px)",borderRadius:20,border:`1px solid ${cardBrd}`,overflow:"hidden",boxShadow:isNight?"0 8px 32px rgba(0,0,0,0.4)":"0 8px 32px rgba(200,80,30,0.12)"}}>
              {/* Section header */}
              <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"15px 18px 11px",borderBottom:`1px solid ${isNight?"rgba(255,255,255,0.07)":"rgba(0,0,0,0.05)"}`}}>
                <div style={{display:"flex",alignItems:"center",gap:9}}>
                  <div style={{color:accent,display:"flex"}}><Icon/></div>
                  <span style={{fontSize:17,fontWeight:700,color:textMain,letterSpacing:"-0.01em"}}>{label}</span>
                  {allDone&&<span style={{fontSize:9,fontWeight:700,letterSpacing:"0.14em",textTransform:"uppercase",background:accent,color:"#fff",padding:"2px 8px",borderRadius:20,fontFamily:"'Courier New',monospace"}}>Done</span>}
                </div>
                <button onClick={()=>{setAdding(adding===key?null:key);setNewName("");setNewDose("");}} style={{width:30,height:30,borderRadius:9,border:"none",background:isNight?"rgba(255,255,255,0.08)":"rgba(0,0,0,0.06)",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",color:isNight?"#c4b5fd":"#7c3aed"}}>
                  <Plus/>
                </button>
              </div>

              {/* Add form */}
              {adding===key&&(
                <div style={{padding:"12px 18px",borderBottom:`1px solid ${isNight?"rgba(255,255,255,0.07)":"rgba(0,0,0,0.05)"}`,background:isNight?"rgba(167,139,250,0.07)":"rgba(139,92,246,0.04)"}}>
                  <input autoFocus placeholder="Medicine name" value={newName} onChange={e=>setNewName(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addPill(key)}
                    style={{width:"100%",padding:"9px 12px",borderRadius:9,border:"none",background:isNight?"rgba(255,255,255,0.1)":"rgba(255,255,255,0.85)",color:textMain,fontSize:15,outline:"none",marginBottom:8,fontFamily:"inherit"}}/>
                  <input placeholder="Dose (e.g. 1 tablet)" value={newDose} onChange={e=>setNewDose(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addPill(key)}
                    style={{width:"100%",padding:"9px 12px",borderRadius:9,border:"none",background:isNight?"rgba(255,255,255,0.1)":"rgba(255,255,255,0.85)",color:textMain,fontSize:15,outline:"none",marginBottom:10,fontFamily:"inherit"}}/>
                  <div style={{display:"flex",gap:8}}>
                    <button onClick={()=>addPill(key)} style={{flex:1,padding:"9px",borderRadius:9,border:"none",background:accent,color:"#fff",fontSize:13,fontWeight:700,cursor:"pointer",fontFamily:"'Courier New',monospace",letterSpacing:"0.06em",textTransform:"uppercase"}}>Add</button>
                    <button onClick={()=>setAdding(null)} style={{padding:"9px 14px",borderRadius:9,border:"none",background:isNight?"rgba(255,255,255,0.07)":"rgba(0,0,0,0.06)",color:textMuted,fontSize:13,cursor:"pointer"}}>Cancel</button>
                  </div>
                </div>
              )}

              {/* Pills */}
              <div style={{padding:"6px 0"}}>
                {pills.length===0
                  ? <div style={{textAlign:"center",padding:"22px",color:textMuted,fontSize:13,fontStyle:"italic"}}>No medicines — tap + to add</div>
                  : pills.map(pill=>{
                    const t=!!log[pill.id];
                    return (
                      <div key={pill.id} style={{display:"flex",alignItems:"center",gap:12,padding:"10px 18px",opacity:t?0.55:1,transition:"opacity 0.3s"}}>
                        <button onClick={()=>toggleTaken(key,pill.id)} style={{width:28,height:28,borderRadius:8,flexShrink:0,border:`2px solid ${t?accent:isNight?"rgba(200,180,255,0.25)":"rgba(0,0,0,0.13)"}`,background:t?accent:"transparent",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",color:"#fff",transform:flash===pill.id?"scale(1.35)":"scale(1)",transition:"all 0.2s cubic-bezier(0.34,1.56,0.64,1)"}}>
                          {t&&<Check/>}
                        </button>
                        <div style={{flex:1,minWidth:0}}>
                          <div style={{fontSize:15,fontWeight:600,color:textMain,textDecoration:t?"line-through":"none",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{pill.name}</div>
                          <div style={{fontSize:11,color:textMuted,fontFamily:"'Courier New',monospace"}}>{pill.dose}</div>
                        </div>
                        <button onClick={()=>deletePill(key,pill.id)} style={{width:26,height:26,borderRadius:7,flexShrink:0,border:"none",background:"transparent",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",color:isNight?"rgba(200,180,255,0.2)":"rgba(0,0,0,0.15)",transition:"color 0.2s"}}
                          onTouchStart={e=>e.currentTarget.style.color="#ef4444"}
                          onTouchEnd={e=>e.currentTarget.style.color=isNight?"rgba(200,180,255,0.2)":"rgba(0,0,0,0.15)"}>
                          <Trash/>
                        </button>
                      </div>
                    );
                  })
                }
              </div>
            </div>
          );
        })}

        <div style={{textAlign:"center",fontSize:10,color:textMuted,fontFamily:"'Courier New',monospace",letterSpacing:"0.1em",textTransform:"uppercase",paddingTop:4}} className="safe-bottom">
          Saved locally · Resets at midnight
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>

<!-- Service Worker (inline via blob) -->
<script>
if ("serviceWorker" in navigator) {
  const swCode = `
const CACHE = "pill-reminder-v1";
const ASSETS = [self.location.pathname];

self.addEventListener("install", e => {
  e.waitUntil(caches.open(CACHE).then(c => c.addAll(ASSETS)));
  self.skipWaiting();
});
self.addEventListener("activate", e => {
  e.waitUntil(caches.keys().then(keys =>
    Promise.all(keys.filter(k=>k!==CACHE).map(k=>caches.delete(k)))
  ));
  self.clients.claim();
});
self.addEventListener("fetch", e => {
  e.respondWith(
    caches.match(e.request).then(r => r || fetch(e.request).then(res => {
      const clone = res.clone();
      caches.open(CACHE).then(c => c.put(e.request, clone));
      return res;
    }))
  );
});
  `;
  const swBlob = new Blob([swCode], {type:"application/javascript"});
  const swURL  = URL.createObjectURL(swBlob);
  navigator.serviceWorker.register(swURL, {scope:"./"})
    .then(()=> console.log("SW registered"))
    .catch(e => console.warn("SW failed:", e));
}
</script>
