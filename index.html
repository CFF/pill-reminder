function todayStr(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;}
function formatTodayHeader(){return new Date().toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"});}
function formatDayHeader(str){
  const[y,m,d]=str.split("-").map(Number);
  const dt=new Date(y,m-1,d);
  return{weekday:dt.toLocaleDateString("en-US",{weekday:"long"}),date:dt.toLocaleDateString("en-US",{month:"long",day:"numeric"})};
}
function formatShort(str){
  const[y,m,d]=str.split("-").map(Number);
  return new Date(y,m-1,d).toLocaleDateString("en-US",{month:"short",day:"numeric"});
}
function formatFull(str){
  const[y,m,d]=str.split("-").map(Number);
  return new Date(y,m-1,d).toLocaleDateString("en-US",{month:"long",day:"numeric",year:"numeric"});
}
function getLast30Days(){return Array.from({length:30},(_,i)=>{const d=new Date();d.setDate(d.getDate()-i);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;});}

function addDays(str,n){
  const[y,m,d]=str.split("-").map(Number);
  const dt=new Date(y,m-1,d);
  dt.setDate(dt.getDate()+n);
  return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,"0")}-${String(dt.getDate()).padStart(2,"0")}`;
}

// ── IndexedDB ─────────────────────────────────────────────────────
const DB_NAME="pill-reminder",DB_VER=1,DB_STORE="kv";
let _db=null;
function openDB(){
  if(_db)return Promise.resolve(_db);
  return new Promise((res,rej)=>{
    const r=indexedDB.open(DB_NAME,DB_VER);
    r.onupgradeneeded=e=>{e.target.result.createObjectStore(DB_STORE);};
    r.onsuccess=e=>{_db=e.target.result;res(_db);};
    r.onerror=rej;
  });
}
async function dbGet(k){
  const db=await openDB();
  return new Promise((res,rej)=>{
    const r=db.transaction(DB_STORE,"readonly").objectStore(DB_STORE).get(k);
    r.onsuccess=()=>res(r.result??null);r.onerror=rej;
  });
}
async function dbSet(k,v){
  const db=await openDB();
  return new Promise((res,rej)=>{
    const tx=db.transaction(DB_STORE,"readwrite");
    tx.objectStore(DB_STORE).put(v,k);tx.oncomplete=res;tx.onerror=rej;
  });
}
async function migrateFromLS(){
  const keys=[PILL_LIST_KEY,...getLast30Days().map(d=>dayKey(d))];
  for(const k of keys){
    try{const lsVal=localStorage.getItem(k);if(lsVal){const existing=await dbGet(k);if(existing===null)await dbSet(k,JSON.parse(lsVal));localStorage.removeItem(k);}}catch{}
  }
}

// ── OpenFDA drug search ──────────────────────────────────────────
async function searchDrugs(query){
  if(!query||query.length<2) return [];
  try{
    const q=encodeURIComponent(query);
    const url=`https://api.fda.gov/drug/label.json?search=openfda.brand_name:${q}+openfda.generic_name:${q}&limit=10`;
    const res = await fetch(url);
    if(!res.ok) return [];
    const data = await res.json();
    const results = [];
    const seen = new Set();
    function toTitle(s){if(!s)return "";return s.charAt(0).toUpperCase()+s.slice(1).toLowerCase();}
    for(const r of (data.results||[])){
      const brands = r.openfda?.brand_name||[];
      const generics = r.openfda?.generic_name||[];
      for(const name of brands){
        const key=name.toLowerCase();
        if(!seen.has(key)){seen.add(key);results.push({name:toTitle(name),sub:generics[0]?toTitle(generics[0]):""});}
      }
      for(const name of generics){
        const key=name.toLowerCase();
        if(!seen.has(key)){seen.add(key);results.push({name:toTitle(name),sub:brands[0]?`Brand: ${toTitle(brands[0])}`:"Generic"});}
      }
      if(results.length>=8) break;
    }
    return results.slice(0,8);
  }catch(e){return [];}
}

function getDrugTips(name){
  if(!name) return null;
  const lower = name.toLowerCase();
  for(const [key, val] of Object.entries(DRUG_TIPS)){
    if(lower.includes(key)){
      if(val.ref) return DRUG_TIPS[val.ref];
      return val;
    }
  }
  return null;
}

function ShapeIcon({shape, size=18, color="currentColor"}){
  const aliases = {"oblong_scored":"oblong", "round_scored":"round_scored"};
  const resolved = aliases[shape] || shape;
  const s = SHAPES.find(x => x.value === resolved);
  if(!s) return <ShapeCapsule size={size} color={color}/>;
  return <s.Icon size={size} color={color}/>;
}

async function archiveExpired(pillList){
  const today=todayStr();
  const toArchive={morning:[],lunch:[],evening:[]};
  const remaining={morning:[],lunch:[],evening:[]};
  let changed=false;

  for(const session of ["morning","lunch","evening"]){
    for(const pill of (pillList[session]||[])){
      if(pill.durationDays!=null && pill.startDate){
        const endDate=addDays(pill.startDate, pill.durationDays);
        if(today>=endDate){
          toArchive[session].push({...pill, archivedOn:today, endDate});
          changed=true;
          continue;
        }
      }
      remaining[session].push(pill);
    }
  }

  if(!changed) return pillList;

  const existing=await dbGet(ARCHIVED_KEY)||{morning:[],night:[]};
  const newArchive={
    morning:[...existing.morning,...toArchive.morning],
    lunch:  [...existing.lunch||[],...toArchive.lunch],
    evening:[...existing.evening||[],...toArchive.evening],
  };
  await dbSet(ARCHIVED_KEY, newArchive);
  await dbSet(PILL_LIST_KEY, remaining);
  return remaining;
}

// ── History helpers ───────────────────────────────────────────────
// Returns all pills (active + archived) that were active on a given date,
// each annotated with their session key.
function buildActivePillsForDate(date, pillList, archived) {
  const pills = [];

  for (const session of ["morning","lunch","evening"]) {
    for (const pill of (pillList[session]||[])) {
      if (!pill.durationDays || !pill.startDate) {
        // Ongoing — active on every day
        pills.push({...pill, session});
      } else {
        const end = addDays(pill.startDate, pill.durationDays);
        if (date >= pill.startDate && date < end) {
          pills.push({...pill, session});
        }
      }
    }
    // Archived pills: active if startDate <= date < endDate
    for (const pill of (archived[session]||[])) {
      if (pill.startDate && pill.endDate && date >= pill.startDate && date < pill.endDate) {
        pills.push({...pill, session});
      }
    }
  }

  return pills;
}

function dayScore(log, list, archived, date) {
  if (!log) return {pct:0, taken:0, total:0};
  const pills = date
    ? buildActivePillsForDate(date, list, archived)
    : [
        ...(list.morning||[]).map(p=>({...p,session:"morning"})),
        ...(list.lunch||[]).map(p=>({...p,session:"lunch"})),
        ...(list.evening||[]).map(p=>({...p,session:"evening"})),
      ];
  const t = pills.length;
  const k = pills.filter(p => log[p.session]?.[p.id]).length;
  return {pct: t ? Math.round(k/t*100) : 0, taken: k, total: t};
}

                :(()=>{
                  const allArchiveDates=Object.keys(archiveByDate);
                  const allDates=[...new Set([...history.map(h=>h.date),...allArchiveDates])].sort((a,b)=>b.localeCompare(a));
                  let rowIndex=0;
                  return allDates.map(date=>{
                    const histEntry=history.find(h=>h.date===date);
                    const archEntries=archiveByDate[date]||[];
                    const elements=[];
                    if(archEntries.length>0){
                      archEntries.forEach((ev)=>{
                        const isFirst=rowIndex===0;rowIndex++;
                        elements.push(
                          <GroupRow key={`arch-${ev.pill.id}`} first={isFirst}>
                            <div style={{display:"flex",alignItems:"center",gap:10,padding:"11px 16px",background:"var(--card)"}}>
                              <span style={{color:"var(--t3)",display:"flex",flexShrink:0}}><IconArchive/></span>
                              <span style={{fontSize:13,color:"var(--t3)",fontStyle:"italic"}}>
                                <span style={{fontStyle:"normal",fontWeight:500,color:"var(--t2)"}}>{ev.pill.name}</span>
                                {" "}finished on {formatFull(ev.pill.endDate)}
                              </span>
                            </div>
                          </GroupRow>
                        );
                      });
                    }
                    if(histEntry){
                      const{pct,taken:tk,total:tt}=dayScore(histEntry.log,pillList,archived,date);
                      const isToday=date===todayStr();
                      const col=pct===100?"var(--green)":pct>=50?"var(--acc)":"var(--red)";
                      const C=2*Math.PI*13;
                      const isFirst=rowIndex===0;rowIndex++;
                      const activePillsForDots=buildActivePillsForDate(date,pillList,archived);
                      elements.push(
                        <GroupRow key={date} first={isFirst} onClick={()=>setSelectedDay(date)}>
                          <div style={{display:"flex",alignItems:"center",gap:13,padding:"13px 16px"}}>
                            <div style={{position:"relative",width:32,height:32,flexShrink:0}}>
                              <svg width="32" height="32" style={{transform:"rotate(-90deg)"}}>
                                <circle cx="16" cy="16" r="13" fill="none" stroke="var(--sep)" strokeWidth="3.5"/>
                                <circle cx="16" cy="16" r="13" fill="none" stroke={col} strokeWidth="3.5"
                                  strokeDasharray={C} strokeDashoffset={C*(1-pct/100)} strokeLinecap="round"/>
                              </svg>
                              <div style={{position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center",
                                fontSize:8,fontWeight:700,color:col,letterSpacing:"-0.02em"}}>{pct}%</div>
                            </div>
                            <div style={{flex:1,minWidth:0}}>
                              <div style={{fontSize:16,fontWeight:isToday?700:600,color:"var(--t1)"}}>
                                {isToday
                                  ?<span>Today <span style={{fontSize:13,fontWeight:500,color:"var(--t2)"}}>· {formatShort(date)}</span></span>
                                  :(()=>{
                                    const[y,m,d]=date.split("-").map(Number);
                                    const dt=new Date(y,m-1,d);
                                    const wd=dt.toLocaleDateString("en-US",{weekday:"short"});
                                    const md=dt.toLocaleDateString("en-US",{month:"short",day:"numeric"});
                                    return<span>{wd} <span style={{fontWeight:500,color:"var(--t2)"}}>· {md}</span></span>;
                                  })()
                                }
                              </div>
                              <div style={{fontSize:13,color:"var(--t2)",marginTop:2}}>{tk} of {tt} medicines taken</div>
                            </div>
                            <div style={{display:"flex",flexWrap:"wrap",gap:3,width:32,justifyContent:"flex-end",flexShrink:0}}>
                              {activePillsForDots.map(p=>(
                                <div key={p.id} style={{width:7,height:7,borderRadius:"50%",
                                  background:histEntry.log?.[p.session]?.[p.id]?"var(--green)":"var(--sep)"}}/>
                              ))}
                            </div>
                            <div style={{color:"var(--t3)",marginLeft:2}}><IconChevron/></div>
                          </div>
                        </GroupRow>
                      );
                    }
                    return elements;
                  });
                })()
              }
            </GroupCard>
          )}
        </div>
      </div>
    </div>
    <TabBar view={view} setView={setView} setSelectedDay={setSelectedDay}/>
    </>
  );
}

function SettingsView({view,setView,setSelectedDay,profile,setProfile,pillList,archived,setPillList,setArchived,fileInputRef}){
  async function exportData(){
    const days=getLast30Days();
    const logs={};
    for(const d of days){const l=await dbGet(dayKey(d));if(l)logs[d]=l;}
    const data={pillList,archived,logs,profile,exportedAt:new Date().toISOString()};
    const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");a.href=url;a.download="pill-reminder-backup.json";a.click();
    URL.revokeObjectURL(url);
  }
  async function importData(file){
    try{
      const text=await file.text();
      const data=JSON.parse(text);
      if(data.pillList){await dbSet(PILL_LIST_KEY,data.pillList);setPillList(data.pillList);}
      if(data.archived){await dbSet(ARCHIVED_KEY,data.archived);setArchived(data.archived);}
      if(data.logs){for(const[d,l] of Object.entries(data.logs))await dbSet(dayKey(d),l);}
      if(data.profile){await dbSet(PROFILE_KEY,data.profile);setProfile(data.profile);}
      alert("Import successful!");
    }catch(e){alert("Import failed — invalid file.");}
  }
  return(
    <div style={{minHeight:"100vh",background:"var(--bg)",paddingBottom:"calc(90px + env(safe-area-inset-bottom, 0px))"}} className="fade-up">
      <div style={{maxWidth:480,margin:"0 auto"}}>
        <div style={{
          background:"var(--card)",borderRadius:"0 0 24px 24px",
          boxShadow:"var(--shadow-md)",marginBottom:6,
          paddingTop:"calc(env(safe-area-inset-top, 20px) + 20px)",
          paddingBottom:18,paddingLeft:20,paddingRight:20,
        }}>
          <div style={{fontSize:12,color:"var(--t3)",fontWeight:500,letterSpacing:"0.06em",textTransform:"uppercase",marginBottom:4}}>Preferences</div>
          <h1 className="serif" style={{fontSize:34,fontWeight:400,color:"var(--t1)",letterSpacing:"-0.01em",lineHeight:1.05}}>Settings</h1>
        </div>
        <div style={{padding:"18px 20px 0"}}>
          <div style={{marginBottom:28}}>
            <div style={{fontSize:12,fontWeight:600,color:"var(--t3)",textTransform:"uppercase",letterSpacing:"0.07em",marginBottom:10}}>Profile</div>
            <div style={{background:"var(--card)",borderRadius:16,overflow:"hidden",boxShadow:"var(--shadow-sm)"}}>
              {[{field:"name",label:"Name",placeholder:"Your name",type:"text",width:160},
                {field:"age",label:"Age",placeholder:"—",type:"number",width:120},
                {field:"weight",label:"Weight (kg)",placeholder:"—",type:"number",width:120},
                {field:"height",label:"Height (cm)",placeholder:"—",type:"number",width:120}
              ].map(({field,label,placeholder,type,width},i)=>(
                <div key={field} style={{position:"relative"}}>
                  {i>0&&<div style={{position:"absolute",top:0,left:16,right:0,height:"0.5px",background:"var(--sep)"}}/>}
                  <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"13px 16px"}}>
                    <span style={{fontSize:15,color:"var(--t2)",fontWeight:500}}>{label}</span>
                    <input type={type} value={profile[field]||""} placeholder={placeholder}
                      onChange={e=>{const v=e.target.value;const newP={...profile,[field]:v};setProfile(newP);dbSet(PROFILE_KEY,newP);}}
                      style={{border:"none",background:"transparent",color:"var(--t1)",
                        fontSize:15,fontWeight:500,textAlign:"right",width,WebkitAppearance:"none"}}/>
                  </div>
                </div>
              ))}
            </div>
          </div>
          <div style={{marginBottom:28}}>
            <div style={{fontSize:12,fontWeight:600,color:"var(--t3)",textTransform:"uppercase",letterSpacing:"0.07em",marginBottom:10}}>Data</div>
            <div style={{background:"var(--card)",borderRadius:16,overflow:"hidden",boxShadow:"var(--shadow-sm)"}}>
              <button onClick={exportData}
                style={{width:"100%",display:"flex",alignItems:"center",justifyContent:"space-between",
                  padding:"15px 16px",background:"transparent",color:"var(--t1)",fontSize:15,fontWeight:500,textAlign:"left"}}>
                Export backup
                <span style={{fontSize:13,color:"var(--blue)"}}>Download JSON</span>
              </button>
              <div style={{height:"0.5px",background:"var(--sep)"}}/>
              <button onClick={()=>fileInputRef.current?.click()}
                style={{width:"100%",display:"flex",alignItems:"center",justifyContent:"space-between",
                  padding:"15px 16px",background:"transparent",color:"var(--t1)",fontSize:15,fontWeight:500,textAlign:"left"}}>
                Import backup
                <span style={{fontSize:13,color:"var(--blue)"}}>Choose file</span>
              </button>
              <input ref={fileInputRef} type="file" accept=".json" style={{display:"none"}}
                onChange={e=>{if(e.target.files?.[0])importData(e.target.files[0]);}}/>
            </div>
          </div>
          <div style={{marginBottom:28}}>
            <div style={{fontSize:12,fontWeight:600,color:"var(--t3)",textTransform:"uppercase",letterSpacing:"0.07em",marginBottom:10}}>About</div>
            <div style={{background:"var(--card)",borderRadius:16,overflow:"hidden",boxShadow:"var(--shadow-sm)"}}>
              <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"13px 16px"}}>
                <span style={{fontSize:15,color:"var(--t2)"}}>App</span>
                <span style={{fontSize:15,color:"var(--t1)",fontWeight:500}}>Pill Reminder</span>
              </div>
              <div style={{height:"0.5px",background:"var(--sep)"}}/>
              <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"13px 16px"}}>
                <span style={{fontSize:15,color:"var(--t2)"}}>Version</span>
                <span style={{fontSize:15,color:"var(--t1)",fontWeight:500}}>pr-v51</span>
              </div>
              <div style={{height:"0.5px",background:"var(--sep)"}}/>
              <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"13px 16px"}}>
                <span style={{fontSize:15,color:"var(--t2)"}}>Storage</span>
                <span style={{fontSize:15,color:"var(--t1)",fontWeight:500}}>Local · IndexedDB</span>
              </div>
            </div>
          </div>
          <p style={{fontSize:12,color:"var(--t3)",textAlign:"center",lineHeight:1.6,paddingBottom:12}} className="safe-bottom">
            Data is stored locally on this device only.<br/>Nothing is sent to any server.
          </p>
        </div>
      </div>
      <TabBar view={view} setView={setView} setSelectedDay={setSelectedDay}/>
    </div>
  );
}

function App(){
  const [view,setView]          = useState("today");
  const [pillList,setPillList]  = useState(null);
  const [archived,setArchived]  = useState({morning:[],lunch:[],evening:[]});
  const [todayLog,setTodayLog]  = useState(null);
  const [history,setHistory]    = useState([]);
  const [adding,setAdding]      = useState(null);
  const [flash,setFlash]        = useState(null);
  const [loading,setLoading]    = useState(true);
  const [selectedDay,setSelectedDay] = useState(null);
  const [installPrompt,setInstallPrompt] = useState(null);
  const [installed,setInstalled]= useState(false);
  const [menuOpen,setMenuOpen]  = useState(null);
  const [editing,setEditing]    = useState(null);
  const [detailSheet,setDetailSheet] = useState(null);
  const [profile,setProfile]    = useState({name:"",age:"",weight:"",height:""});
  const fileInputRef            = useRef(null);

  useEffect(()=>{
    const h=e=>{e.preventDefault();setInstallPrompt(e);};
    window.addEventListener("beforeinstallprompt",h);
    window.addEventListener("appinstalled",()=>{setInstalled(true);setInstallPrompt(null);});
    return()=>window.removeEventListener("beforeinstallprompt",h);
  },[]);

  useEffect(()=>{
    (async()=>{
      await migrateFromLS();
      let list=await dbGet(PILL_LIST_KEY)||DEFAULT_PILLS;
      if(list.night&&!list.evening){
        list={...list,evening:list.night,lunch:list.lunch||[]};
        delete list.night;
        await dbSet(PILL_LIST_KEY,list);
      }
      if(!list.lunch) list={...list,lunch:[]};
      list=await archiveExpired(list);
      setPillList(list);
      const arch=await dbGet(ARCHIVED_KEY)||{morning:[],lunch:[],evening:[]};
      // Normalise legacy night key
      if(arch.night&&!arch.evening){arch.evening=arch.night;delete arch.night;}
      if(!arch.lunch) arch.lunch=[];
      setArchived(arch);
      const prof=await dbGet(PROFILE_KEY)||{name:"",age:"",weight:"",height:""};
      setProfile(prof);
      const today=todayStr();
      let log=await dbGet(dayKey(today));
      if(!log){log=buildEmptyLog(list);await dbSet(dayKey(today),log);}
      setTodayLog(log);
      setLoading(false);
    })();
  },[]);

  function buildEmptyLog(list){
    const m={},l={},e={};
    (list.morning||[]).forEach(p=>m[p.id]=false);
    (list.lunch||[]).forEach(p=>l[p.id]=false);
    (list.evening||[]).forEach(p=>e[p.id]=false);
    return{morning:m,lunch:l,evening:e};
  }

  const loadHistory=useCallback(async()=>{
    const days=getLast30Days();
    const results=await Promise.all(days.map(async d=>({date:d,log:await dbGet(dayKey(d))})));
    setHistory(results.filter(r=>r.log!==null));
  },[]);
  useEffect(()=>{if(view==="history")loadHistory();},[view,loadHistory]);

  async function toggleTaken(session,id){
    const newLog={...todayLog,[session]:{...todayLog[session],[id]:!todayLog[session][id]}};
    setTodayLog(newLog);
    await dbSet(dayKey(todayStr()),newLog);
    if(newLog[session][id]){setFlash(id);setTimeout(()=>setFlash(null),400);}
  }

  async function toggleHistoryTaken(date,session,id){
    const existing=await dbGet(dayKey(date))||{morning:{},lunch:{},evening:{}};
    const newLog={...existing,[session]:{...existing[session],[id]:!existing[session]?.[id]}};
    await dbSet(dayKey(date),newLog);
    setHistory(prev=>prev.map(h=>h.date===date?{...h,log:newLog}:h));
  }

  async function addPill(defaultSession, pillData){
    const sess=pillData.session||defaultSession;
    const id=`${sess[0]}${Date.now()}`;
    const {session:_,...rest}=pillData;
    const pill={id,...rest};
    const newList={...pillList,[sess]:[...(pillList[sess]||[]),pill]};
    const newLog={...todayLog,[sess]:{...todayLog[sess],[id]:false}};
    setPillList(newList);setTodayLog(newLog);
    await dbSet(PILL_LIST_KEY,newList);
    await dbSet(dayKey(todayStr()),newLog);
    setAdding(null);
  }

  async function deletePill(session,id){
    const newList={...pillList,[session]:pillList[session].filter(p=>p.id!==id)};
    const newLog={...todayLog,[session]:{...todayLog[session]}};
    delete newLog[session][id];
    setPillList(newList);setTodayLog(newLog);
    await dbSet(PILL_LIST_KEY,newList);
    await dbSet(dayKey(todayStr()),newLog);
  }

  async function savePillEdit(pillData){
    if(!editing)return;
    const{session,id}=editing;
    const newList={...pillList,[session]:pillList[session].map(p=>
      p.id===id?{...p,...pillData}:p
    )};
    setPillList(newList);
    await dbSet(PILL_LIST_KEY,newList);
    setEditing(null);
  }

  const sessions=pillList?[
    {key:"morning",label:"Morning",Icon:IconSun,  accent:"var(--acc)"},
    {key:"lunch",  label:"Lunch",  Icon:IconFork, accent:"var(--acc)"},
    {key:"evening",label:"Evening",Icon:IconMoon, accent:"var(--acc)"},
  ]:[];

  if(loading)return(
    <div style={{minHeight:"100vh",background:"var(--bg)",display:"flex",alignItems:"center",justifyContent:"center"}}>
      <div style={{color:"var(--t2)",fontSize:14}}>Loading…</div>
    </div>
  );

  if(view==="history") return(
    <HistoryView
      view={view} setView={setView}
      selectedDay={selectedDay} setSelectedDay={setSelectedDay}
      history={history} pillList={pillList} archived={archived}
      sessions={sessions}
      toggleHistoryTaken={toggleHistoryTaken}
    />
  );

  if(view==="settings") return(
    <SettingsView
      view={view} setView={setView} setSelectedDay={setSelectedDay}
      profile={profile} setProfile={setProfile}
      pillList={pillList} archived={archived}
      setPillList={setPillList} setArchived={setArchived}
      fileInputRef={fileInputRef}
    />
  );

  const total=sessions.reduce((s,{key})=>s+(pillList[key]||[]).length,0);
  const taken=sessions.reduce((s,{key})=>{const p=pillList[key]||[],l=todayLog[key]||{};return s+p.filter(x=>l[x.id]).length;},0);
  const pct=total?taken/total:0;
  const R=33,C=2*Math.PI*R;
  const ringCol=pct===1?"var(--green)":"var(--acc)";

  return(
    <>
    <div style={{minHeight:"100vh",background:"var(--bg)",paddingBottom:"calc(90px + env(safe-area-inset-bottom, 0px))"}} className="fade-up">
      <div style={{maxWidth:480,margin:"0 auto"}}>

        <div style={{
          background:"var(--card)",
          borderRadius:"0 0 24px 24px",
          boxShadow:"var(--shadow-md)",
          marginBottom:6,
          paddingTop:"calc(env(safe-area-inset-top, 20px) + 20px)",
          paddingBottom:18,paddingLeft:20,paddingRight:20,
          backgroundImage:"radial-gradient(ellipse at 110% -10%, var(--acc-glow) 0%, transparent 60%)",
        }}>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:12}}>
            <div>
              <div style={{fontSize:12,color:"var(--t3)",fontWeight:500,letterSpacing:"0.06em",textTransform:"uppercase",lineHeight:1.2,marginBottom:4}}>
                {new Date().toLocaleDateString("en-US",{weekday:"long"})}
              </div>
              <h1 className="serif" style={{fontSize:36,fontWeight:400,color:"var(--t1)",letterSpacing:"-0.01em",lineHeight:1.05}}>
                {new Date().toLocaleDateString("en-US",{month:"long",day:"numeric"})}
              </h1>
            </div>
            <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:4,flexShrink:0}}>
              <div style={{position:"relative",width:76,height:76}}>
                <svg width="76" height="76" style={{transform:"rotate(-90deg)"}}>
                  <circle cx="38" cy="38" r={R} fill="none" stroke="var(--sep)" strokeWidth="5.5"/>
                  <circle cx="38" cy="38" r={R} fill="none" stroke={ringCol} strokeWidth="5.5"
                    strokeDasharray={C} strokeDashoffset={C*(1-pct)} strokeLinecap="round" className="ring-fill"/>
                </svg>
                <div style={{position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column",gap:0}}>
                  <span style={{fontSize:17,fontWeight:700,color:ringCol,lineHeight:1,letterSpacing:"-0.03em"}}>{taken}/{total}</span>
                  <span style={{fontSize:9,color:"var(--t3)",textTransform:"uppercase",letterSpacing:"0.08em",marginTop:3,fontWeight:600}}>taken</span>
                </div>
              </div>

            </div>
          </div>

          <div style={{marginTop:16,marginBottom:4}}>
              {installPrompt&&!installed&&(
                <button onClick={()=>{installPrompt.prompt();installPrompt.userChoice.then(()=>setInstallPrompt(null));}}
                  style={{background:"var(--acc-soft)",color:"var(--acc)",fontSize:12,fontWeight:600,
                    padding:"5px 12px",borderRadius:20,letterSpacing:"0.02em"}}>
                  ⬇︎ Add to Home Screen
                </button>
              )}
          </div>
        </div>

        <div style={{padding:"18px 20px 0"}}>
          <div style={{marginBottom:20,marginTop:8,display:"flex",alignItems:"center",justifyContent:"space-between"}}>
            <div className="serif" style={{fontSize:26,fontWeight:400,color:"var(--t1)",letterSpacing:"-0.01em",lineHeight:1.1}}>Today's Medications</div>
            <button onClick={()=>setAdding(adding?null:sessions[0].key)}
              style={{display:"flex",alignItems:"center",gap:5,
                padding:"7px 14px",borderRadius:20,
                background:"var(--acc-soft)",color:"var(--acc)",
                fontSize:13,fontWeight:600,border:"none",cursor:"pointer",flexShrink:0}}>
              <IconPlus/> Add
            </button>
          </div>

          {sessions.filter(({key})=>(pillList[key]||[]).length>0||adding===key).map(({key,label,Icon,accent})=>{
            const pills=pillList[key]||[], log=todayLog[key]||{};
            const allDone=pills.length>0&&pills.every(p=>log[p.id]);
            const prog=pills.filter(p=>log[p.id]).length;

            return(
              <div key={key} style={{marginBottom:28}}>
                <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",
                  marginBottom:10}}>
                  <span style={{display:"flex",alignItems:"center",gap:6,
                    fontSize:12,fontWeight:600,color:"var(--t3)",textTransform:"uppercase",letterSpacing:"0.07em"}}>
                    <Icon/>
                    {label}
                  </span>
                  <span style={{fontSize:13,fontWeight:500,color:allDone?"var(--green)":"var(--t3)"}}>
                    {allDone?"✓ Done":`${prog} / ${pills.length}`}
                  </span>
                </div>

                {adding===key&&(
                  <div style={{marginBottom:10,borderRadius:14,overflow:"hidden",
                    boxShadow:"0 1px 3px rgba(0,0,0,0.07)"}}>
                    <PillForm
                      accent={accent}
                      defaultSession={key}
                      initial={{session:key}}
                      onSave={data=>addPill(key,{...data,session:key})}
                      onCancel={()=>setAdding(null)}
                      submitLabel="Add"
                    />
                  </div>
                )}

                <div style={{display:"flex",flexDirection:"column",gap:10}}>
                  {pills.map(pill=>{
                    const t=!!log[pill.id];
                    const isEditing=editing?.id===pill.id;
                    const tl=timingLabel(pill.timing);
                    let durationInfo=null;
                    if(pill.durationDays!=null&&pill.startDate){
                      const endDate=addDays(pill.startDate,pill.durationDays);
                      const today=todayStr();
                      const[ey,em,ed]=endDate.split("-").map(Number);
                      const[ty,tm,td]=today.split("-").map(Number);
                      const daysLeft=Math.round((new Date(ey,em-1,ed)-new Date(ty,tm-1,td))/(1000*60*60*24));
                      durationInfo=daysLeft<=3
                        ?`${daysLeft} day${daysLeft!==1?"s":""} left`
                        :`Until ${formatShort(endDate)}`;
                    }

                    if(isEditing) return(
                      <div key={pill.id} style={{borderRadius:14,overflow:"hidden",
                        boxShadow:"0 1px 3px rgba(0,0,0,0.07)"}}>
                        <PillForm
                          initial={{...pill,session:key}}
                          accent={accent}
                          onSave={savePillEdit}
                          onCancel={()=>setEditing(null)}
                          submitLabel="Save"
                        />
                      </div>
                    );

                    return(
                      <div key={pill.id}
                        className="pill-card pill-press"
                        onClick={()=>setDetailSheet({pill,session:key,accent})}
                        style={{
                          display:"flex",alignItems:"center",
                          background:"var(--card)",
                          borderRadius:18,
                          overflow:"hidden",
                          boxShadow:"var(--shadow-md)",
                          cursor:"pointer",
                          opacity:t?0.55:1,
                          animationDelay:`${pills.indexOf(pill)*60}ms`,
                        }}
                      >
                        <div style={{
                          width:68,height:80,flexShrink:0,
                          background:"var(--sep)",
                          display:"flex",alignItems:"center",justifyContent:"center",
                        }}>
                          <ShapeIcon shape={pill.shape} size={28} color="var(--t3)"/>
                        </div>
                        <div style={{flex:1,minWidth:0,padding:"4px 14px"}}>
                          <div style={{fontSize:16,fontWeight:600,color:"var(--t1)",letterSpacing:"-0.01em",
                            whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>
                            {pill.name}
                          </div>
                          <div style={{fontSize:13,color:"var(--t2)",marginTop:2,fontWeight:400}}>
                            {pill.dose}
                          </div>
                          {(tl||durationInfo)&&(
                            <div style={{fontSize:12,color:"var(--t3)",marginTop:3,display:"flex",gap:5}}>
                              {tl&&<span>{tl}</span>}
                              {tl&&durationInfo&&<span>·</span>}
                              {durationInfo&&<span style={{color:durationInfo.includes("left")?"var(--acc)":"var(--t3)"}}>{durationInfo}</span>}
                            </div>
                          )}
                        </div>
                        <div style={{paddingRight:16,flexShrink:0}}>
                          <button
                            onClick={e=>{e.stopPropagation();toggleTaken(key,pill.id);}}
                            className={flash===pill.id?"pop":""}
                            style={{width:28,height:28,borderRadius:"50%",
                              border:`2px solid ${t?accent:"var(--sep)"}`,
                              background:t?accent:"transparent",
                              display:"flex",alignItems:"center",justifyContent:"center",
                              color:"#fff",transition:"border-color 0.15s,background 0.15s"}}>
                            {t&&<IconCheck/>}
                          </button>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            );
          })}

          {sessions.every(({key})=>(pillList[key]||[]).length===0)&&!adding&&(
            <div style={{
              background:"var(--card)",borderRadius:16,
              boxShadow:"0 1px 4px rgba(0,0,0,0.08)",
              padding:"32px 24px",
              display:"flex",flexDirection:"column",alignItems:"center",gap:16,
              textAlign:"center",
            }}>
              <div style={{width:52,height:52,borderRadius:14,background:"var(--acc-soft)",
                display:"flex",alignItems:"center",justifyContent:"center",color:"var(--acc)"}}>
                <IconClipboardList size={26}/>
              </div>
              <div>
                <div style={{fontSize:16,fontWeight:600,color:"var(--t1)",marginBottom:4}}>No medications yet</div>
                <div style={{fontSize:14,color:"var(--t2)"}}>Add your first one to get started</div>
              </div>
              <button onClick={()=>setAdding("morning")}
                style={{display:"inline-flex",alignItems:"center",gap:8,
                  padding:"12px 24px",borderRadius:14,
                  background:"var(--acc)",color:"#fff",
                  fontSize:15,fontWeight:600,
                  boxShadow:"0 2px 8px rgba(224,94,0,0.3)"}}>
                <IconPlus/>
                Add a medication
              </button>
            </div>
          )}

          {(()=>{
            const allPills=[
              ...(pillList.morning||[]),
              ...(pillList.lunch||[]),
              ...(pillList.evening||[]),
            ];
            const cards=allPills.map(p=>getDrugTips(p.name)).filter(Boolean)
              // Deduplicate by label
              .filter((t,i,arr)=>arr.findIndex(x=>x.label===t.label)===i);

            return(
              <div style={{marginTop:28}}>
                <div style={{marginBottom:14}}>
                  <div className="serif" style={{fontSize:26,fontWeight:400,color:"var(--t1)",letterSpacing:"-0.01em",lineHeight:1.1}}>Recommendations</div>
                </div>
                {cards.length===0?(
                  <div style={{
                    background:"var(--card)",borderRadius:16,
                    boxShadow:"0 1px 4px rgba(0,0,0,0.08)",
                    padding:"28px 24px",
                    display:"flex",flexDirection:"column",alignItems:"center",gap:10,
                    textAlign:"center",
                  }}>
                    <span style={{fontSize:32}}>✅</span>
                    <div style={{fontSize:15,fontWeight:600,color:"var(--t1)"}}>No alerts for your current medications</div>
                    <div style={{fontSize:13,color:"var(--t2)",lineHeight:1.5}}>Tips will appear here when you have medications with important interactions or precautions.</div>
                  </div>
                ):cards.map(tip=>(
                  <div key={tip.label} style={{background:"var(--card)",borderRadius:14,overflow:"hidden",
                    marginBottom:12,boxShadow:"0 1px 3px rgba(0,0,0,0.07)"}}>
                    {/* Card header */}
                    <div style={{display:"flex",alignItems:"center",gap:10,
                      padding:"13px 16px",borderBottom:"0.5px solid var(--sep)"}}>
                      <span style={{fontSize:13,fontWeight:600,color:"var(--t1)",letterSpacing:"0.08em",fontVariant:"small-caps",textTransform:"lowercase"}}>{tip.label}</span>
                    </div>
                    {/* Points */}
                    {tip.points.map((pt,i)=>(
                      <div key={i} style={{position:"relative"}}>
                        {i>0&&<div style={{position:"absolute",top:0,left:16,right:0,height:"0.5px",background:"var(--sep)"}}/>}
                        <div style={{display:"flex",alignItems:"flex-start",gap:12,padding:"12px 16px"}}>
                          <span style={{flexShrink:0,display:"flex",alignItems:"center",color:"var(--t2)",marginTop:2}}><TipIcon name={pt.icon} size={16}/></span>
                          <p style={{margin:0,fontSize:14,lineHeight:1.6,color:"var(--t2)",fontWeight:500}}>{pt.text}</p>
                        </div>
                      </div>
                    ))}
                    <div style={{padding:"10px 16px",borderTop:"0.5px solid var(--sep)"}}>
                      <p style={{margin:0,fontSize:11,color:"var(--t3)",fontStyle:"italic"}}>
                        Always follow your doctor's instructions. This is general information only.
                      </p>
                    </div>
                  </div>
                ))}
              </div>
            );
          })()}

          <div style={{textAlign:"center",fontSize:12,color:"var(--t3)",paddingTop:16,paddingBottom:12,letterSpacing:"0.02em"}} className="safe-bottom">
            Saved locally · Resets at midnight
          </div>
        </div>
      </div>

      {/* Detail bottom sheet */}
      {detailSheet&&ReactDOM.createPortal(
        <>
          <div onClick={()=>setDetailSheet(null)}
            style={{position:"fixed",inset:0,zIndex:1100,
              background:"rgba(0,0,0,0.4)",
              backdropFilter:"blur(2px)",WebkitBackdropFilter:"blur(2px)"}}/>
          <div
            ref={el=>{if(el){el.scrollTop=0;requestAnimationFrame(()=>{el.scrollTop=0;});}}}
            style={{
            position:"fixed",bottom:0,left:0,right:0,zIndex:1101,
            background:"var(--card)",
            borderRadius:"20px 20px 0 0",
            boxShadow:"0 -4px 32px rgba(0,0,0,0.18)",
            paddingBottom:"env(safe-area-inset-bottom,24px)",
            maxHeight:"90vh",overflowY:"auto",
            animation:"sheetUp 0.28s cubic-bezier(0.32,0.72,0,1)",
          }}>
            <style>{`@keyframes sheetUp{from{transform:translateY(100%)}to{transform:translateY(0)}}`}</style>

            <div style={{display:"flex",justifyContent:"center",paddingTop:12,paddingBottom:8}}>
              <div style={{width:36,height:4,borderRadius:2,background:"var(--sep)"}}/>
            </div>

            <div style={{display:"flex",alignItems:"center",gap:14,padding:"4px 20px 16px"}}>
              <div style={{width:52,height:52,borderRadius:14,flexShrink:0,
                background:"var(--sep)",
                display:"flex",alignItems:"center",justifyContent:"center"}}>
                <ShapeIcon shape={detailSheet.pill.shape} size={28} color="var(--t2)"/>
              </div>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:20,fontWeight:700,color:"var(--t1)",
                  whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>
                  {detailSheet.pill.name}
                </div>
                <div style={{fontSize:14,color:"var(--t2)",marginTop:2}}>{detailSheet.pill.dose}</div>
              </div>
              <button onClick={()=>{deletePill(detailSheet.session,detailSheet.pill.id);setDetailSheet(null);}}
                style={{width:36,height:36,borderRadius:10,flexShrink:0,border:"none",cursor:"pointer",
                  background:"rgba(255,59,48,0.10)",display:"flex",alignItems:"center",justifyContent:"center",
                  color:"var(--red)"}}>
                <IconTrash/>
              </button>
            </div>

            <div style={{borderTop:"0.5px solid var(--sep)"}}>
              <PillForm
                initial={detailSheet.pill}
                accent={detailSheet.accent}
                submitLabel="Save"
                noAutoFocus={true}
                onSave={async(data)=>{
                  const oldSession=detailSheet.session;
                  const newSession=data.session||oldSession;
                  const id=detailSheet.pill.id;
                  const{session:_,...rest}=data;
                  let newList={...pillList};
                  if(newSession!==oldSession){
                    // Move pill to new session
                    newList[oldSession]=(newList[oldSession]||[]).filter(p=>p.id!==id);
                    newList[newSession]=[...(newList[newSession]||[]),{...detailSheet.pill,...rest}];
                    // Update today's log
                    const newLog={...todayLog};
                    delete newLog[oldSession][id];
                    newLog[newSession]={...newLog[newSession],[id]:false};
                    setTodayLog(newLog);
                    await dbSet(dayKey(todayStr()),newLog);
                  } else {
                    newList[oldSession]=newList[oldSession].map(p=>p.id===id?{...p,...rest}:p);
                  }
                  setPillList(newList);
                  await dbSet(PILL_LIST_KEY,newList);
                  setDetailSheet(null);
                }}
                onCancel={()=>setDetailSheet(null)}
              />
            </div>
          </div>
        </>,
        document.body
      )}

      {/* Portal dropdown */}
      {menuOpen&&ReactDOM.createPortal(
        <>
          <div onClick={()=>setMenuOpen(null)} style={{position:"fixed",inset:0,zIndex:999}}/>
          <div style={{position:"fixed",top:menuOpen.top,right:menuOpen.right,zIndex:1000,
            background:"var(--card)",borderRadius:12,
            boxShadow:"0 4px 24px rgba(0,0,0,0.18),0 1px 4px rgba(0,0,0,0.10)",
            minWidth:150,overflow:"hidden"}}>
            <button
              onClick={e=>{e.stopPropagation();setEditing({session:menuOpen.session,id:menuOpen.pill.id});setMenuOpen(null);}}
              style={{width:"100%",display:"flex",alignItems:"center",gap:10,
                padding:"14px 16px",background:"transparent",
                color:"var(--t1)",fontSize:15,fontWeight:500,textAlign:"left",
                borderBottom:"0.5px solid var(--sep)"}}>
              <span style={{color:"var(--blue)",display:"flex"}}><IconPencil/></span>
              Edit
            </button>
            <button
              onClick={e=>{e.stopPropagation();deletePill(menuOpen.session,menuOpen.pill.id);setMenuOpen(null);}}
              style={{width:"100%",display:"flex",alignItems:"center",gap:10,
                padding:"14px 16px",background:"transparent",
                color:"var(--red)",fontSize:15,fontWeight:500,textAlign:"left"}}>
              <span style={{display:"flex"}}><IconTrash/></span>
              Delete
            </button>
          </div>
        </>,
        document.body
      )}
      <TabBar view={view} setView={setView} setSelectedDay={setSelectedDay}/>
    </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>

<script>
if("serviceWorker"in navigator){
  const sw=`const C="pr-v51",A=[self.location.pathname];self.addEventListener("install",e=>{e.waitUntil(caches.open(C).then(c=>c.addAll(A)));self.skipWaiting();});self.addEventListener("activate",e=>{e.waitUntil(caches.keys().then(ks=>Promise.all(ks.filter(k=>k!==C).map(k=>caches.delete(k)))));self.clients.claim();});self.addEventListener("fetch",e=>{e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request).then(res=>{const cl=res.clone();caches.open(C).then(c=>c.put(e.request,cl));return res;})));});`;
  navigator.serviceWorker.register(URL.createObjectURL(new Blob([sw],{type:"application/javascript"})),{scope:"./"}).catch(e=>console.warn(e));
}
</script>
</body>
</html>
